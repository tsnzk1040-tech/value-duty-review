<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アイコン比較 1 / 1b / 1c</title>
    <style>
      body { font-family: sans-serif; max-width: 32rem; margin: 0 auto; padding: 1.25rem; color: #111; }
      h1 { font-size: 1.25rem; margin: 0.25rem 0 0.5rem; }
      p, h2 { margin: 0 0 0.5rem; }
      .muted { color: #666; font-size: 0.875rem; line-height: 1.45; }
      section { margin: 1.35rem 0; }
      .row { display: flex; gap: 1.25rem; align-items: flex-end; flex-wrap: wrap; }
      .cell { display: flex; flex-direction: column; gap: 0.35rem; align-items: center; }
      .cell span { font-size: 0.75rem; color: #666; }
      img.sq { width: 7rem; height: 7rem; border-radius: 22%; object-fit: cover; background: #111; }
      .round, .safe {
        width: 7rem; height: 7rem; border-radius: 50%; overflow: hidden; background: #111; position: relative;
      }
      .round img, .safe img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .safe::after {
        content: "";
        position: absolute; inset: 10%;
        border: 1px dashed rgba(255,255,255,0.7);
        border-radius: 50%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <p class="muted">企業理念リレー</p>
    <h1>1 / 1b / 1c</h1>
    <p class="muted">この3つに絞った。中列がスマホの丸切り。</p>
    <section>
      <h2>1 元の斜め階段</h2>
      <div class="row">
        <div class="cell"><img class="sq" src="icon-spiral-1.jpg" alt="" /><span>角丸</span></div>
        <div class="cell"><div class="round"><img src="icon-spiral-1.jpg" alt="" /></div><span>丸切り</span></div>
        <div class="cell"><div class="safe"><img src="icon-spiral-1.jpg" alt="" /></div><span>安全域</span></div>
      </div>
    </section>
    <section>
      <h2>1b 細く高く巻く</h2>
      <div class="row">
        <div class="cell"><img class="sq" src="icon-spiral-1b.jpg" alt="" /><span>角丸</span></div>
        <div class="cell"><div class="round"><img src="icon-spiral-1b.jpg" alt="" /></div><span>丸切り</span></div>
        <div class="cell"><div class="safe"><img src="icon-spiral-1b.jpg" alt="" /></div><span>安全域</span></div>
      </div>
    </section>
    <section>
      <h2>1c 吹き抜けが見える</h2>
      <div class="row">
        <div class="cell"><img class="sq" src="icon-spiral-1c.jpg" alt="" /><span>角丸</span></div>
        <div class="cell"><div class="round"><img src="icon-spiral-1c.jpg" alt="" /></div><span>丸切り</span></div>
        <div class="cell"><div class="safe"><img src="icon-spiral-1c.jpg" alt="" /></div><span>安全域</span></div>
      </div>
    </section>
  </body>
</html>
